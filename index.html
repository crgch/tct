<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>트윗 이미지 분할기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* 레이아웃: 상단 탭 + [위: 작업/미리보기 화면 | 아래: 설정(스크롤)] */
  --bg:#eef2f0; --surface:#ffffff; --surface-2:#f5f8f7; --ink:#15201c; --muted:#5b6a65; --line:#d6dedb;
  --accent:#0b7a6b; --accent-ink:#ffffff; --accent-soft:#dcefea; --danger:#b83a28;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1412; --surface:#151d1a; --surface-2:#1b2522; --ink:#e4ebe8; --muted:#93a39d; --line:#2a3632;
    --accent:#3cc4ae; --accent-ink:#06201b; --accent-soft:#173a33; --danger:#ff8a73;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1412; --surface:#151d1a; --surface-2:#1b2522; --ink:#e4ebe8; --muted:#93a39d; --line:#2a3632;
  --accent:#3cc4ae; --accent-ink:#06201b; --accent-soft:#173a33; --danger:#ff8a73;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;overflow:hidden}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
[hidden]{display:none !important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{flex:none;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{padding:10px 16px;display:flex;align-items:center;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto;flex-wrap:wrap}
.brand h1{font-size:17px;font-weight:700;margin:0;letter-spacing:-.01em;text-wrap:balance}
.brand small{color:var(--muted);font-family:var(--f-mono);font-size:11.5px}
.tabs{display:flex;gap:2px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px}
.tab{appearance:none;border:0;background:transparent;color:var(--muted);font:inherit;font-weight:600;padding:7px 18px;border-radius:7px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line),0 1px 2px rgba(0,0,0,.06)}

main{flex:1;min-height:0;display:flex;flex-direction:column;padding:12px 16px 16px}
/* 화면 = [위: 작업/미리보기 화면] [손잡이] [아래: 설정, 휠로 스크롤] */
.view{--stage:60%;flex:1;min-height:0;display:flex;flex-direction:column}
.stage-area{flex:0 0 var(--stage);min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;overflow:hidden}
.stage-bar{display:flex;gap:8px 16px;align-items:center;flex-wrap:wrap}
.stage-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-left:auto}
.out-meta{font-size:12.5px;color:var(--muted)}
.out-meta .mono{color:var(--ink)}
.resizer{flex:none;height:14px;display:flex;align-items:center;justify-content:center;cursor:row-resize;touch-action:none}
.resizer span{width:48px;height:4px;border-radius:2px;background:var(--line)}
.resizer:hover span,.resizer:focus-visible span,.resizer.drag span{background:var(--accent)}
.resizer:focus-visible{outline:none}

.canvas-box{flex:1 1 0;min-height:0;display:flex;justify-content:center;align-items:center;background:var(--surface-2);border-radius:10px;padding:12px;overflow:auto}
.canvas-box.wide{justify-content:flex-start}
.canvas-box.drop{outline:2px dashed var(--accent);outline-offset:-6px}
#cropCanvas{display:block;flex:none;touch-action:none;cursor:grab;box-shadow:0 0 0 1px var(--line),0 6px 18px rgba(0,0,0,.08)}
#cropCanvas:active{cursor:grabbing}
.tool-row{display:flex;gap:8px 16px;align-items:center;flex-wrap:wrap}
.brush-field{grid-template-columns:auto 140px auto}
#cropCanvas.brush{cursor:crosshair}
.fx-opts{display:flex;flex-direction:column;gap:10px}
.fx-opts .lbl{font-size:12.5px;color:var(--muted);width:30px}
.stage-meta{display:flex;justify-content:space-between;gap:6px 16px;flex-wrap:wrap;color:var(--muted);font-size:12.5px}
.stage-meta .mono{color:var(--ink)}

.panel{flex:1 1 0;min-height:0;min-width:0;overflow-y:auto;overscroll-behavior:contain;background:var(--surface);border:1px solid var(--line);border-radius:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));align-content:start}
.panel section{padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0;box-shadow:0 0 0 .5px var(--line)}
.panel section.full{grid-column:1 / -1}
.panel h2{font-size:12px;font-weight:600;color:var(--muted);margin:0;letter-spacing:.02em;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.panel h2 .mono{font-weight:500}
.sub{font-size:12px;color:var(--muted);margin:2px 0 -4px}
.hint{font-size:12px;color:var(--muted);margin:0}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.file-name{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:180px}

.btn{appearance:none;font:inherit;font-weight:600;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 12px;border-radius:8px;cursor:pointer;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.small{padding:5px 9px;font-size:12px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:progress}
.actions{display:grid;grid-template-columns:1fr;gap:8px}

.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:9px;padding:2px;background:var(--surface-2);gap:2px;align-self:flex-start}
.seg button{appearance:none;border:0;background:transparent;font:inherit;font-size:13px;font-weight:600;color:var(--muted);padding:6px 11px;border-radius:7px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.seg button[disabled]{opacity:.4;cursor:not-allowed}
.seg.mono-seg button{font-family:var(--f-mono);font-weight:500;font-size:12.5px;padding:6px 9px}

.stepper{display:inline-flex;align-items:stretch;border:1px solid var(--line);border-radius:9px;overflow:hidden;align-self:flex-start}
.stepper button{appearance:none;border:0;background:var(--surface-2);color:var(--ink);font:inherit;font-size:16px;width:34px;cursor:pointer}
.stepper button:hover{background:var(--accent-soft)}
.stepper input{width:52px;border:0;border-left:1px solid var(--line);border-right:1px solid var(--line);text-align:center;font-family:var(--f-mono);font-size:14px;color:var(--ink);background:var(--surface);-moz-appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.stepper-wrap{display:flex;align-items:center;gap:10px}
.stepper-wrap span{font-size:12.5px;color:var(--muted)}

.slot-picker{position:relative;width:100%;max-width:220px;aspect-ratio:16/9}
.slot-picker button,.slot-strip button{appearance:none;font:inherit;font-family:var(--f-mono);font-size:13px;font-weight:500;border-radius:4px;cursor:pointer;border:1.5px dashed var(--line);background:var(--surface-2);color:var(--muted);display:flex;align-items:center;justify-content:center}
.slot-picker button{position:absolute}
.slot-strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:5px}
.slot-strip button{height:36px}
.slot-picker button[aria-pressed="true"],.slot-strip button[aria-pressed="true"]{background:var(--accent);border:1.5px solid var(--accent);color:var(--accent-ink)}

input[type=range]{accent-color:var(--accent);width:100%;margin:0}
input[type=color]{width:38px;height:30px;border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:2px;cursor:pointer}
select{font:inherit;font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px;flex:1;min-width:0}
label{font-size:13px}
.check{display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.check input{accent-color:var(--accent);margin-top:3px}
output{font-family:var(--f-mono);font-size:12.5px;min-width:48px;text-align:right}
.field{display:grid;grid-template-columns:64px 1fr auto;gap:8px;align-items:center}

.pieces{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.piece{display:flex;flex-direction:column;gap:4px;border:1px solid var(--line);border-radius:9px;padding:6px;background:var(--surface-2)}
.piece .thumb{height:84px;display:flex;align-items:center;justify-content:center}
.piece canvas{max-width:100%;max-height:84px;width:auto;height:auto;display:block;border-radius:3px;box-shadow:0 0 0 1px var(--line)}
.pc-meta{display:flex;justify-content:space-between;align-items:baseline;gap:4px;line-height:1.2}
.pc-meta .n{font-size:12.5px;font-weight:600}
.pc-meta .size{font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}

/* 미리보기 */
.pv-top{padding:0}
.ratio-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px}
.ratio-grid label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:3px 3px 3px 8px;background:var(--surface-2);font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.ratio-grid label.diff{border-color:var(--accent);color:var(--ink)}
.ratio-grid input{width:100%;min-width:0;border:1px solid transparent;background:var(--surface);border-radius:5px;padding:4px 6px;font-family:var(--f-mono);font-size:12.5px;color:var(--ink)}
.ratio-grid input:focus{border-color:var(--accent);outline:none}
.timeline{flex:1;min-height:0;overflow:auto;border-radius:13px;padding:16px 0;display:flex;background:var(--t-bg);transition:background .2s}
.timeline > .tweet{margin:auto}
.timeline[data-tone="light"]{--t-bg:#ffffff;--t-ink:#0f1419;--t-sub:#536471;--t-line:#e1e8ed;--t-empty:#f2f5f7}
.timeline[data-tone="dim"]{--t-bg:#15202b;--t-ink:#f7f9f9;--t-sub:#8b98a5;--t-line:#38444d;--t-empty:#1e2a36}
.timeline[data-tone="black"]{--t-bg:#000000;--t-ink:#e7e9ea;--t-sub:#71767b;--t-line:#2f3336;--t-empty:#16181c}
.tweet{--mw:516px;width:calc(var(--mw) + 84px);max-width:100%;padding:12px 16px;display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;color:var(--t-ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",var(--f-body);font-size:15px;line-height:1.35}
.tweet.fit{width:100%}
.avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#7fb9ad,#3d6f8f)}
.tw-body{min-width:0;display:flex;flex-direction:column;gap:6px}
.tw-head{display:flex;gap:4px;align-items:baseline;flex-wrap:wrap}
.tw-name{font-weight:700}
.tw-handle{color:var(--t-sub)}
.tw-text{outline:none;white-space:pre-wrap;word-break:break-word;border-radius:4px}
.tw-text:focus{box-shadow:0 0 0 1px var(--t-line)}
.media-wrap{position:relative;margin-top:6px}
.media{position:relative;width:100%}
.media.grid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:2px;aspect-ratio:16/9;border-radius:16px;overflow:hidden;border:1px solid var(--t-line);background:var(--t-bg)}
.media.grid.n1{grid-template-columns:1fr;grid-template-rows:1fr}
.media.grid.n2 .slot{grid-row:1 / 3}
.media.grid.n3 .slot:first-child{grid-row:1 / 3}
.media.carousel{display:flex;gap:4px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.media.carousel::-webkit-scrollbar{display:none}
.slot{position:relative;overflow:hidden;background:var(--t-empty);min-width:0;min-height:0;cursor:pointer}
.media.carousel .slot{flex:0 0 auto;height:100%;border-radius:10px;border:1px solid var(--t-line);scroll-snap-align:start}
.slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;-webkit-user-drag:none;user-select:none}
.slot.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--t-sub);font-size:12.5px;text-align:center;padding:8px}
.slot.empty::before{content:"";position:absolute;inset:8px;border:1.5px dashed var(--t-line);border-radius:8px;pointer-events:none}
.slot.empty b{font-family:var(--f-mono);font-size:18px;font-weight:500;color:var(--t-ink)}
.slot.picked{box-shadow:inset 0 0 0 3px var(--accent)}
.slot.over{box-shadow:inset 0 0 0 3px var(--accent);filter:brightness(1.08)}
.badge{position:absolute;top:8px;left:8px;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:rgba(0,0,0,.66);color:#fff;font-family:var(--f-mono);font-size:12px;display:flex;align-items:center;justify-content:center;pointer-events:none}
.slot .x{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.66);color:#fff;font-size:15px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
.media.clean .badge,.media.clean .x{display:none}
.slot.narrow .x{display:none;width:20px;height:20px;font-size:13px;top:auto;bottom:6px;right:50%;transform:translateX(50%)}
.slot.narrow:hover .x,.slot.narrow:focus-within .x{display:flex}
.media.clean .slot.narrow .x{display:none}
.slot.narrow .badge{top:4px;left:50%;transform:translateX(-50%);min-width:18px;height:18px;padding:0 4px;font-size:10.5px}
.slot.narrow.empty span{display:none}
.slot.narrow.empty b{font-size:12px}
.slot.narrow.empty::before{inset:3px;border-radius:6px}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:50%;border:0;background:rgba(15,20,25,.72);color:#fff;font-size:18px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:2}
.nav.prev{left:8px}.nav.next{right:8px}
.count-pill{position:absolute;bottom:8px;right:8px;background:rgba(15,20,25,.72);color:#fff;font-family:var(--f-mono);font-size:12px;border-radius:10px;padding:2px 8px;z-index:2;pointer-events:none}
.tw-actions{display:flex;justify-content:space-between;max-width:425px;color:var(--t-sub);padding-top:6px}
.tw-actions svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

.order-list{display:flex;gap:6px;flex-wrap:wrap}
.ord{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:9px;padding:4px 8px 4px 4px;background:var(--surface-2);font-size:12px}
.ord-n{font-family:var(--f-mono);font-weight:500;min-width:18px;text-align:center}
.ord img,.ord .ph{width:32px;height:32px;border-radius:5px;object-fit:cover;display:block}
.ord .ph{border:1.5px dashed var(--line)}
.ord-l{color:var(--muted);font-family:var(--f-mono);font-size:11.5px}
.strip{display:flex;overflow-x:auto;border-radius:6px;background:var(--surface-2);padding:6px}
.strip img,.strip .ph{height:96px;width:auto;display:block;flex:none}
.strip .ph{background:repeating-linear-gradient(45deg,var(--line) 0 4px,transparent 4px 10px)}

.pool{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;padding:2px}
.pool-item{position:relative;border:1px solid var(--line);border-radius:9px;background:var(--surface-2);padding:4px;cursor:pointer;display:flex;flex-direction:column;gap:4px;color:inherit}
.pool-item img{width:100%;aspect-ratio:1;object-fit:contain;display:block;border-radius:5px;background:repeating-conic-gradient(var(--line) 0 25%,transparent 0 50%) 0 0/12px 12px;-webkit-user-drag:none}
.pool-item .lbl{font-size:11.5px;font-family:var(--f-mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 2px}
.pool-item .used{position:absolute;top:8px;left:8px;background:var(--accent);color:var(--accent-ink);font-family:var(--f-mono);font-size:11px;border-radius:9px;padding:1px 6px;max-width:calc(100% - 44px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pool-item .rm{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.pool-item.picked{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.pool.drop{outline:2px dashed var(--accent);outline-offset:4px;border-radius:8px}
.pool-empty{grid-column:1/-1;font-size:12.5px;color:var(--muted);border:1.5px dashed var(--line);border-radius:9px;padding:16px;text-align:center}

.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,12px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:13px;display:flex;gap:12px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.2);transition:opacity .2s,transform .2s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast button{appearance:none;border:0;background:transparent;color:var(--accent);font:inherit;font-weight:700;cursor:pointer;white-space:nowrap;filter:brightness(1.3)}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:70}
.modal-box{background:var(--surface);color:var(--ink);border-radius:14px;max-width:640px;width:100%;max-height:90%;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
.modal-box h3{margin:0;font-size:16px}
.fb-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.fb-list figure{margin:0;display:flex;flex-direction:column;gap:4px}
.fb-list img{width:100%;border-radius:6px;box-shadow:0 0 0 1px var(--line)}
.fb-list figcaption{font-family:var(--f-mono);font-size:11px;color:var(--muted);word-break:break-all}

@media (prefers-reduced-motion: reduce){*{transition:none !important;scroll-behavior:auto !important}}
@media (max-width:420px){main{padding:8px 10px 10px}.top-in{padding:8px 12px}.canvas-box{padding:8px}.stage-area{padding:8px}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand">
      <h1>트윗 이미지 분할기</h1>
      <small>캐러셀 최대 20장 · 그리드 2~4장</small>
    </div>
    <div class="tabs" role="tablist" aria-label="화면 전환">
      <button class="tab" role="tab" id="tab-split" data-tab="split" aria-selected="true" aria-controls="view-split">분할</button>
      <button class="tab" role="tab" id="tab-preview" data-tab="preview" aria-selected="false" aria-controls="view-preview">미리보기</button>
    </div>
  </div>
</header>

<main>
  <!-- 분할 -->
  <div id="view-split" class="view" role="tabpanel" aria-labelledby="tab-split">
    <section class="stage-area" aria-label="자를 영역">
      <div class="stage-bar">
      <div class="tool-row" id="toolRow" hidden>
        <div class="seg" id="toolSeg" role="group" aria-label="작업 도구">
          <button type="button" data-tool="move" aria-pressed="true">이동·확대</button>
          <button type="button" data-tool="erase" aria-pressed="false">선 지우기 붓</button>
          <button type="button" data-tool="restore" aria-pressed="false">선 되살리기 붓</button>
        </div>
        <div class="field brush-field">
          <label for="brush">붓 크기</label>
          <input type="range" id="brush" min="4" max="200" step="1" value="40">
          <output id="brushOut" for="brush">40</output>
        </div>
        <button class="btn small" id="maskClear" type="button">칠한 곳 모두 지우기</button>
      </div>
      <div class="stage-actions">
        <span
